name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate public materials before deployment
        run: |
          node tests/validate-section02.cjs
          node tests/validate-section01.cjs
          node tests/validate-player.cjs
          node tests/validate-orientation.cjs
          node tests/validate-section00.cjs
          node tests/validate-public-boundary.cjs
          node tests/validate-linen-theme.cjs

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
